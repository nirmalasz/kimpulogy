name: Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: hology-67
  GAR_LOCATION: asia-southeast2
  GKE_CLUSTER: larisin-cluster
  GKE_ZONE: asia-southeast2
  REPOSITORY: larisin-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Build and Push Backend
        run: |
          IMAGE_BACKEND="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}"
          docker build -t $IMAGE_BACKEND -f backend/Dockerfile backend/
          docker push $IMAGE_BACKEND
          echo "IMAGE_BACKEND=$IMAGE_BACKEND" >> $GITHUB_ENV

      - name: Build and Push Frontend
        run: |
          IMAGE_FRONTEND="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}"
          docker build -t $IMAGE_FRONTEND -f frontend/Dockerfile frontend/
          docker push $IMAGE_FRONTEND
          echo "IMAGE_FRONTEND=$IMAGE_FRONTEND" >> $GITHUB_ENV

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/larisin-backend backend=${{ env.IMAGE_BACKEND }}
          kubectl set image deployment/larisin-frontend frontend=${{ env.IMAGE_FRONTEND }}
          kubectl rollout status deployment/larisin-backend --timeout=180s
          kubectl rollout status deployment/larisin-frontend --timeout=180s
